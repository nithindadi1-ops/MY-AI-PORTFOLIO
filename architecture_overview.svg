<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      text { font-family: system-ui, sans-serif; fill: #e2e8f0; }
      .title { font-size: 13px; font-weight: 600; }
      .sub { font-size: 11px; fill: #94a3b8; }
      .label { font-size: 10px; fill: #64748b; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#0f1117"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">AI Portfolio — Architecture Overview</text>

  <!-- PROJECT 1: DataChat -->
  <rect x="30" y="70" width="170" height="180" rx="10" fill="#1e2130" stroke="#6366f1" stroke-width="1.5"/>
  <text x="115" y="95" text-anchor="middle" class="title" fill="#818cf8">DataChat</text>
  <text x="115" y="113" text-anchor="middle" class="sub">AI Data Analyst</text>
  <rect x="50" y="125" width="130" height="28" rx="6" fill="#252840"/>
  <text x="115" y="144" text-anchor="middle" font-size="11" fill="#c7d2fe">CSV Upload (PapaParse)</text>
  <rect x="50" y="160" width="130" height="28" rx="6" fill="#252840"/>
  <text x="115" y="179" text-anchor="middle" font-size="11" fill="#c7d2fe">LangChain Pandas Agent</text>
  <rect x="50" y="195" width="130" height="28" rx="6" fill="#252840"/>
  <text x="115" y="214" text-anchor="middle" font-size="11" fill="#c7d2fe">Chart.js Visualization</text>

  <!-- PROJECT 2: DoChat -->
  <rect x="220" y="70" width="170" height="180" rx="10" fill="#1a1a2e" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="305" y="95" text-anchor="middle" class="title" fill="#a78bfa">DoChat</text>
  <text x="305" y="113" text-anchor="middle" class="sub">RAG Document Q&amp;A</text>
  <rect x="240" y="125" width="130" height="28" rx="6" fill="#252040"/>
  <text x="305" y="144" text-anchor="middle" font-size="11" fill="#ddd6fe">Text Chunking</text>
  <rect x="240" y="160" width="130" height="28" rx="6" fill="#252040"/>
  <text x="305" y="179" text-anchor="middle" font-size="11" fill="#ddd6fe">FAISS Vector Index</text>
  <rect x="240" y="195" width="130" height="28" rx="6" fill="#252040"/>
  <text x="305" y="214" text-anchor="middle" font-size="11" fill="#ddd6fe">Retrieval + Citations</text>

  <!-- PROJECT 3: PredictIQ -->
  <rect x="410" y="70" width="170" height="180" rx="10" fill="#0f1f18" stroke="#059669" stroke-width="1.5"/>
  <text x="495" y="95" text-anchor="middle" class="title" fill="#34d399">PredictIQ</text>
  <text x="495" y="113" text-anchor="middle" class="sub">ML + Explainability</text>
  <rect x="430" y="125" width="130" height="28" rx="6" fill="#0d2018"/>
  <text x="495" y="144" text-anchor="middle" font-size="11" fill="#6ee7b7">XGBoost Training</text>
  <rect x="430" y="160" width="130" height="28" rx="6" fill="#0d2018"/>
  <text x="495" y="179" text-anchor="middle" font-size="11" fill="#6ee7b7">SHAP Explainability</text>
  <rect x="430" y="195" width="130" height="28" rx="6" fill="#0d2018"/>
  <text x="495" y="214" text-anchor="middle" font-size="11" fill="#6ee7b7">FastAPI Model Serving</text>

  <!-- PROJECT 4: JobMatch -->
  <rect x="600" y="70" width="170" height="180" rx="10" fill="#1f0f18" stroke="#e11d48" stroke-width="1.5"/>
  <text x="685" y="95" text-anchor="middle" class="title" fill="#fb7185">JobMatch AI</text>
  <text x="685" y="113" text-anchor="middle" class="sub">Resume Analyzer</text>
  <rect x="620" y="125" width="130" height="28" rx="6" fill="#250d18"/>
  <text x="685" y="144" text-anchor="middle" font-size="11" fill="#fda4af">TF-IDF Similarity</text>
  <rect x="620" y="160" width="130" height="28" rx="6" fill="#250d18"/>
  <text x="685" y="179" text-anchor="middle" font-size="11" fill="#fda4af">Skill Gap Analysis</text>
  <rect x="620" y="195" width="130" height="28" rx="6" fill="#250d18"/>
  <text x="685" y="214" text-anchor="middle" font-size="11" fill="#fda4af">Radar Chart + LLM</text>

  <!-- Shared LLM Layer -->
  <rect x="130" y="300" width="540" height="60" rx="10" fill="#1a1d2e" stroke="#6366f1" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="400" y="326" text-anchor="middle" font-size="13" font-weight="600" fill="#818cf8">Shared LLM Layer</text>
  <text x="400" y="346" text-anchor="middle" font-size="11" fill="#64748b">Claude API (claude-sonnet-4-6)  |  HuggingFace Mistral-7B (Python backend)  |  sentence-transformers embeddings</text>

  <!-- Arrows from projects to LLM layer -->
  <line x1="115" y1="250" x2="250" y2="300" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="305" y1="250" x2="340" y2="300" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="495" y1="250" x2="460" y2="300" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="685" y1="250" x2="550" y2="300" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Deployment -->
  <rect x="130" y="400" width="540" height="60" rx="10" fill="#131820" stroke="#374151" stroke-width="1"/>
  <text x="400" y="426" text-anchor="middle" font-size="13" font-weight="600" fill="#94a3b8">Deployment</text>
  <text x="400" y="446" text-anchor="middle" font-size="11" fill="#64748b">Browser apps → Netlify (zero config)  |  Python backends → Uvicorn + FastAPI  |  Models → joblib</text>

  <line x1="400" y1="360" x2="400" y2="400" stroke="#374151" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Tech stack footer -->
  <text x="400" y="490" text-anchor="middle" font-size="11" fill="#475569">Python · LangChain · FAISS · XGBoost · SHAP · FastAPI · Pandas · Scikit-learn · Sentence-Transformers</text>
</svg>
