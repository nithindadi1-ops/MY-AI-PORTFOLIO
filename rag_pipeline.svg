<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      text { font-family: system-ui, sans-serif; fill: #e2e8f0; }
      .title { font-size: 12px; font-weight: 600; }
      .sub { font-size: 10px; fill: #94a3b8; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="800" height="340" fill="#0c0f1a"/>
  <text x="400" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">RAG Pipeline — DoChat</text>

  <!-- INDEX PHASE label -->
  <text x="20" y="80" font-size="10" font-weight="600" fill="#7c3aed">INDEX PHASE</text>
  <line x1="20" y1="85" x2="520" y2="85" stroke="#7c3aed" stroke-width="0.5" stroke-dasharray="4 2"/>

  <!-- Index phase boxes -->
  <rect x="20" y="95" width="110" height="60" rx="8" fill="#1a1a2e" stroke="#7c3aed" stroke-width="1"/>
  <text x="75" y="120" text-anchor="middle" class="title" fill="#a78bfa">Documents</text>
  <text x="75" y="137" text-anchor="middle" class="sub">Any text input</text>

  <rect x="165" y="95" width="110" height="60" rx="8" fill="#1a1a2e" stroke="#7c3aed" stroke-width="1"/>
  <text x="220" y="120" text-anchor="middle" class="title" fill="#a78bfa">Chunking</text>
  <text x="220" y="137" text-anchor="middle" class="sub">500 chars, 50 overlap</text>

  <rect x="310" y="95" width="110" height="60" rx="8" fill="#1a1a2e" stroke="#7c3aed" stroke-width="1"/>
  <text x="365" y="120" text-anchor="middle" class="title" fill="#a78bfa">Embeddings</text>
  <text x="365" y="137" text-anchor="middle" class="sub">MiniLM-L6-v2</text>

  <rect x="455" y="95" width="110" height="60" rx="8" fill="#1a1a2e" stroke="#6d28d9" stroke-width="2"/>
  <text x="510" y="120" text-anchor="middle" class="title" fill="#c4b5fd">FAISS Index</text>
  <text x="510" y="137" text-anchor="middle" class="sub">Vector database</text>

  <!-- Index arrows -->
  <line x1="130" y1="125" x2="163" y2="125" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="275" y1="125" x2="308" y2="125" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="420" y1="125" x2="453" y2="125" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- QUERY PHASE label -->
  <text x="20" y="195" font-size="10" font-weight="600" fill="#059669">QUERY PHASE</text>
  <line x1="20" y1="200" x2="780" y2="200" stroke="#059669" stroke-width="0.5" stroke-dasharray="4 2"/>

  <!-- Query phase boxes -->
  <rect x="20" y="210" width="110" height="60" rx="8" fill="#0f1f18" stroke="#059669" stroke-width="1"/>
  <text x="75" y="235" text-anchor="middle" class="title" fill="#34d399">User Query</text>
  <text x="75" y="252" text-anchor="middle" class="sub">Natural language</text>

  <rect x="165" y="210" width="110" height="60" rx="8" fill="#0f1f18" stroke="#059669" stroke-width="1"/>
  <text x="220" y="235" text-anchor="middle" class="title" fill="#34d399">Query Embed</text>
  <text x="220" y="252" text-anchor="middle" class="sub">Same model</text>

  <rect x="310" y="210" width="110" height="60" rx="8" fill="#0f1f18" stroke="#059669" stroke-width="1"/>
  <text x="365" y="235" text-anchor="middle" class="title" fill="#34d399">Top-K Retrieval</text>
  <text x="365" y="252" text-anchor="middle" class="sub">Cosine similarity</text>

  <rect x="455" y="210" width="110" height="60" rx="8" fill="#0f1f18" stroke="#059669" stroke-width="1"/>
  <text x="510" y="235" text-anchor="middle" class="title" fill="#34d399">LLM (Mistral)</text>
  <text x="510" y="252" text-anchor="middle" class="sub">Context + query</text>

  <rect x="600" y="210" width="160" height="60" rx="8" fill="#0f1f18" stroke="#10b981" stroke-width="2"/>
  <text x="680" y="235" text-anchor="middle" class="title" fill="#6ee7b7">Answer + Citations</text>
  <text x="680" y="252" text-anchor="middle" class="sub">Grounded response</text>

  <!-- Query arrows -->
  <line x1="130" y1="240" x2="163" y2="240" stroke="#059669" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="275" y1="240" x2="308" y2="240" stroke="#059669" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="420" y1="240" x2="453" y2="240" stroke="#059669" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="565" y1="240" x2="598" y2="240" stroke="#059669" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- FAISS to Retrieval connection -->
  <path d="M510 155 Q510 183 365 208" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 2" fill="none" marker-end="url(#arr)"/>
  <text x="450" y="185" font-size="10" fill="#7c3aed">lookup</text>

  <text x="400" y="310" text-anchor="middle" font-size="11" fill="#475569">Keyword search (browser) · FAISS semantic search (Python backend) · Source citations returned with every answer</text>
</svg>
