<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>text { font-family: system-ui, sans-serif; fill: #e2e8f0; }</style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="#0a0e1a"/>
  <text x="400" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">ML Pipeline — PredictIQ</text>

  <!-- Steps -->
  <rect x="20"  y="60" width="110" height="140" rx="8" fill="#0f1f18" stroke="#059669" stroke-width="1"/>
  <text x="75"  y="90" text-anchor="middle" font-size="11" font-weight="600" fill="#34d399">Data</text>
