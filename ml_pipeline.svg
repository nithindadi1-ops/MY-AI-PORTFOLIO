  <text x="765" y="130" text-anchor="middle" font-size="9" fill="#6b7280">Fast</text>
  <text x="765" y="145" text-anchor="middle" font-size="9" fill="#6b7280">API</text>

  <text x="400" y="230" text-anchor="middle" font-size="11" fill="#475569">XGBoost · SHAP TreeExplainer · scikit-learn cross-validation · joblib model persistence · FastAPI serving</text>
