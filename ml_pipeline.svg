  <text x="75"  y="126" text-anchor="middle" font-size="10" fill="#6b7280">6 features</text>
  <text x="75"  y="144" text-anchor="middle" font-size="10" fill="#6b7280">Synthetic /</text>
  <text x="75"  y="160" text-anchor="middle" font-size="10" fill="#6b7280">real CSV</text>

  <line x1="130" y1="130" x2="163" y2="130" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="165" y="60" width="110" height="140" rx="8" fill="#0f1f18" stroke="#059669" stroke-width="1"/>
