  <text x="365" y="90" text-anchor="middle" font-size="11" font-weight="600" fill="#6ee7b7">XGBoost</text>
  <text x="365" y="108" text-anchor="middle" font-size="10" fill="#6b7280">300 estimators</text>
  <text x="365" y="126" text-anchor="middle" font-size="10" fill="#6b7280">5-fold CV</text>
  <text x="365" y="144" text-anchor="middle" font-size="10" fill="#6b7280">Class balancing</text>

  <line x1="420" y1="130" x2="453" y2="130" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="455" y="60" width="110" height="140" rx="8" fill="#0f1f18" stroke="#059669" stroke-width="1"/>
