  <text x="510" y="126" text-anchor="middle" font-size="10" fill="#6b7280">F1: 0.830</text>
  <text x="510" y="144" text-anchor="middle" font-size="10" fill="#6b7280">ROC curve</text>

  <line x1="565" y1="130" x2="598" y2="130" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="600" y="60" width="110" height="140" rx="8" fill="#0f1f18" stroke="#059669" stroke-width="1"/>
  <text x="655" y="90" text-anchor="middle" font-size="11" font-weight="600" fill="#34d399">SHAP</text>
  <text x="655" y="108" text-anchor="middle" font-size="10" fill="#6b7280">TreeExplainer</text>
  <text x="655" y="126" text-anchor="middle" font-size="10" fill="#6b7280">Waterfall chart</text>
  <text x="655" y="144" text-anchor="middle" font-size="10" fill="#6b7280">Per-prediction</text>

  <line x1="710" y1="130" x2="743" y2="130" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>

