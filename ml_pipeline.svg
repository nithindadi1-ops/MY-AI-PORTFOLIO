  <text x="220" y="126" text-anchor="middle" font-size="10" fill="#6b7280">Train/test split</text>
  <text x="220" y="144" text-anchor="middle" font-size="10" fill="#6b7280">80/20 stratified</text>

  <line x1="275" y1="130" x2="308" y2="130" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>

